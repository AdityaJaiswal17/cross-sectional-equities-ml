[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-sectional-equities-ml"
version = "0.1.0"
description = "Weekly cross-sectional stock ranking with Ridge and XGBoost, walk-forward tested"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas>=2.1", "scikit-learn", "xgboost", "matplotlib", "yfinance>=0.2.40"]

[project.optional-dependencies]
dev = ["pytest", "flake8", "pytest-cov"]

[tool.setuptools]
packages = ["src"]
